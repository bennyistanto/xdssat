project:
  type: website
  # Render output stays in a gitignored folder; it churns on every build, so it
  # also churns OneDrive sync (see README.md).
  output-dir: _site
  # 404.html is served at any wrong address: this prefixes its root links with /xdssat/
  post-render: scripts/fix-404.ts
  render:
    - index.qmd
    - xdssat/index.qmd
    - xdssat/gridding.qmd
    - xdssat/implementation.qmd
    - xdssat/coverage.qmd
    - xdssat/pythia.qmd
    - xdssat/getting-started.md
    - xdssat/data.qmd
    - xdssat/another-crop.qmd
    - xdssat/examples.qmd
    - java/index.qmd
    - java/data.qmd
    - java/alternatives.qmd
    - java/science.qmd
    - cases/java-maize.qmd
    - cases/niger.qmd
    - cases/kenya.qmd
    - cases/mekong.qmd
    - cases/luzon.qmd
    - learn/index.qmd
    - learn/module1.qmd
    - learn/module2.qmd
    - learn/module3.qmd
    - learn/module4.qmd
    - learn/module5.qmd
    - learn/module6.qmd
    - notebooks/index.qmd
    - notebooks/module1.ipynb
    - notebooks/module2.ipynb
    - notebooks/module3.ipynb
    - notebooks/module4.ipynb
    - notebooks/module5.ipynb
    - notebooks/module6.ipynb
    - about/rebuild.qmd
    - about/faq.qmd
    - about/acknowledgements.qmd
    - 404.qmd
  resources:
    - java/data/
    - assets/
    - learn/data/
    - notebooks/*.ipynb
    - notebooks/*.py
    - notebooks/course-data/

