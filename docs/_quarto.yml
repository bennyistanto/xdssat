bibliography: references.bib
link-citations: true

format:
  html:
    # equations are written as \( inline \) and \[ display \]; "$...$" math is off because the
    # dollar signs of inline ${...} expressions (OJS) and of prices would pair up into math
    from: markdown-tex_math_dollars+tex_math_single_backslash
    html-math-method: mathjax
    theme:
      light: [cosmo, styles/light.scss]
      dark: [darkly, styles/dark.scss]
    css: styles/custom.css
    toc: true
    toc-depth: 3
    number-sections: false
    link-external-newwindow: true
    link-external-icon: true
    smooth-scroll: true
    code-copy: true
    fig-cap-location: bottom

execute:
  echo: false
  # Pages never run the DSSAT engine at render time: notebooks keep their stored
  # outputs (Quarto does not execute .ipynb by default) and anything executed is frozen.
  freeze: auto
