name: Publish documentation site

# Renders the Quarto site in docs/ and deploys it to GitHub Pages.
#
# Nothing is computed here. The pages read CSV, JSON and GeoJSON files that are
# committed (docs/java/data/, docs/learn/data/, docs/cases/data/; written locally by
# docs/scripts/export_data.py, export_cases.py and export_boundaries.py and by the
# training notebooks), the notebooks are shown with their stored
# outputs (Quarto does not execute .ipynb files by default), and no page has a
# Python or R code cell. So the runner needs only Quarto: no DSSAT engine, no
# conda environment, no data downloads. Observable JS runs in the reader's browser.
#
# Runs on pushes to main that touch the site, and by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/quarto-publish.yml"
  workflow_dispatch:

# Pages deployment needs id-token: write and pages: write; contents: read is
# enough because nothing is pushed back to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a build still in progress.
concurrency:
  group: "pages"
  cancel-in-progress: true

# Action versions: the current major releases, all on Node.js 24 (Node.js 20 is
# deprecated on the runners). The runner image is pinned so that the move of
# ubuntu-latest to Ubuntu 26 does not change the build unannounced.
jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # the version the site is built and checked with locally (stable release of
          # 2026-10-30); change both together
          version: "1.11.9"

      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: docs

      # output-dir in docs/_quarto.yml is _site, relative to docs/. v5 leaves out
      # hidden files by default; the site has none that Pages needs.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        # Waits up to 10 minutes (the action's maximum) while Pages copies the artifact
        # to its servers ("syncing_files"); usually seconds. When it times out, the
        # cancel takes a few minutes to complete on Pages: a re-run started before that
        # fails with "in progress deployment", so wait a little before re-running.
        uses: actions/deploy-pages@v5
