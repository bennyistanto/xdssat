# ==========================================================================================
# configs/cases/kenya-maize.yml - case study "Kenya - Maize: is fertiliser worth it?"
# ==========================================================================================
# Rainfed maize (hybrid H610) in the western Kenya highlands, sown on 15 March for the long
# rains, 1991-2023, at 0, 60, 120 and 180 kg N/ha (urea, 1/3 at sowing, 2/3 at 35 days). The
# inputs are prepared into the cache (prepare section); docs/cases/kenya.qmd tells the story.
# configs/rice-java.yml explains every setting.
#   python scripts/prepare_weather.py   --config configs/cases/kenya-maize.yml
#   python scripts/prepare_crop_mask.py --config configs/cases/kenya-maize.yml
#   python scripts/prepare_soils.py     --config configs/cases/kenya-maize.yml --aoi kenya_maize
#   python scripts/run_aoi.py           --config configs/cases/kenya-maize.yml

paths: {engine: null, work: null, agera5: null, soilgrids: null, inputs: null, cache: null, boundaries: null,
  datasets: null}
aoi:
  name: kenya_maize
  bbox: [34.6, 0.1, 35.6, 1.1]
  region: null
inputs: {weather: agera5_case_kenya, crop_mask: maize_spam2020_case_kenya, soil: soilgrids_case_kenya,
  water_regime: null, region: null, zones: null}
prepare:
  weather:
    name: agera5_case_kenya
    description: AgERA5 for the Kenya maize case, 1990-2024
    source: AgERA5 (Copernicus Climate Change Service, doi:10.24381/cds.6c68c9bb), CC BY 4.0
    box: null
    grid_step: null
    years: [1990, 2024]
    station_code: AGE5
    temperature_height_m: 2
    variables:
      TMAX: {files: '{agera5}/t2mmax/agera5_t2mmax_{year}.nc', variable: Temperature_Air_2m_Max_24h}
      TMIN: {files: '{agera5}/t2mmin/agera5_t2mmin_{year}.nc', variable: Temperature_Air_2m_Min_24h}
      SRAD: {files: '{agera5}/srad/agera5_srad_{year}.nc', variable: Solar_Radiation_Flux}
      RAIN: {files: '{agera5}/precip/agera5_precip_{year}.nc', variable: Precipitation_Flux, regrid: mean}
      DEWP: {files: '{agera5}/t2mdp/agera5_t2mdp_{year}.nc', variable: Dew_Point_Temperature_2m_Mean_24h}
      WIND: {files: '{agera5}/ws10m/agera5_ws10m_{year}.nc', variable: Wind_Speed_10m_Mean_24h, height_m: 10}
  crop_mask: {name: maize_spam2020_case_kenya, files: '{inputs}/spam2020/spam2020_V2r2_global_A_MAIZ_A.tif',
    values: ha, box: null, source: 'SPAM 2020 v2r2 (IFPRI, doi:10.7910/DVN/SWPENT), CC BY 4.0: physical
      area of maize, all technologies'}
  water_regime: null
  region: null
  zones: null
  soil: {name: soilgrids_case_kenya, method: soilgrids, soc_scale: none, country: Kenya}
template: {file: templates/XDMZ8201.MZX, crop_model: MZCER048}
cultivars: {H610: IB0060}
treatments:
  nitrogen_kg: [0, 60, 120, 180]
  nitrogen_levels: {0: 0, 60: 3, 116: 1, 120: 4, 180: 5, 401: 2}
  water_regimes:
    irrigated:
      template_level: 4
      irrigation_classes: []
    rainfed:
      template_level: 0
      irrigation_classes: []
  default_regime: rainfed
  share_regimes: {share: irrigated, rest: rainfed}
  initial_soil_water: 0.5
seasons:
  mode: uniform
  year_starts: 01-01
  calendar:
  - name: long_rains
    date: 03-15
    regimes: [rainfed]
  onset: {rain_mm: 50, dasarian: 3, planting_after_days: 20, next_season_after_days: 120, years: null}
  zone_table: null
  zone_column: aez
scenarios:
- {name: baseline}
years: [1991, 2023]
run: {workers: 32, chunk_size: 200, years_per_batch: 5, sample: null, seed: 1, season_days: 300, output_folder: null,
  daily: null}
