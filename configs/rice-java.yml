# ==========================================================================================
# configs/rice-java.yml - case study: rice in Java
# ==========================================================================================
# One experiment file holds every setting of an xdssat run: where things are on this computer,
# the prepared input data, the area, the varieties, the fertilizer and water treatments, the
# planting calendar, the scenarios (CO2, warming, calibration factors) and the years. You
# never need to edit Python.
# This file is the reference: every setting is explained here. configs/README.md lists the
# other files; configs/rice-java-all-options.yml shows every option in use.
#
# How to use it
#   1. Copy this file to configs/xdssat.yml (your own file, never committed), or to
#      configs/<study>.yml for a study you want to keep and share.
#   2. In the copy, fill in the paths section for this computer, then change what you need.
#      Leave this file as it is: it is the reference and the built-in default.
#   3. Check it:  python scripts/check_setup.py             (add --config configs/<study>.yml)
#                 python scripts/run_aoi.py --check         (lists the run folders, runs nothing)
#   4. Run it:    python scripts/run_aoi.py                 (add --config configs/<study>.yml)
#   A quick test of the same file on 30 cells and 2 years (about 35 s):
#                 python scripts/run_aoi.py --sample 30 --years 2015 2016
#   Without --config, scripts read configs/xdssat.yml (or the file named by XDSSAT_CONFIG).
#
# What one run produces
#   Every combination of cultivar x nitrogen rate x scenario gets its own run folder, with the
#   seasonal results (summary.csv, a netCDF file) and a copy of the settings that made them
#   (experiment.yml). 2 cultivars x 3 N rates x 2 scenarios = 12 run folders.
#
# As written, this file reproduces the standard Java run: cultivar IR 58, 140 kg N/ha, uniform
# calendar, agricultural years 1991-2020, no scenario changes. That run simulates 84,870
# seasons (1,187 weather cells, 1,804 cell x water-regime strata, 3.37 million ha of rice)
# and took 14.3 min on the reference machine (2 x Xeon Gold 6138, 32 workers).
#
# How to read the comments
#   Every setting has a comment above it: what it means, the allowed range, a recommended
#   range, what happens when the value is too low or too high, and the default.
#   "Allowed" is what xdssat accepts; a value outside it stops the run with a message.
#   "Recommended" is a sensible place to start, not a limit of the model.
#   "Measured" numbers come from xdssat runs on Java and name the run; they show the size of
#   an effect for this template and region, not a general rule. The rest is either a limit of
#   the DSSAT engine (with its source file) or a plain consequence of how xdssat works.
#
# Rules of the format (YAML)
#   - Indent with spaces, never tabs. Keep the indentation of the lines you edit.
#   - Text after # is a comment and is ignored.
#   - "null" means "not set". Put month-day dates like "11-15" in quotes.
#   - A setting you delete takes the default shown in its comment.
#   - Relative paths are read from the xdssat folder (the one that holds configs/).
#   - A mistake stops the run before anything is simulated, with a message that names the
#     line, the setting, what is wrong, and an example of a valid value.


# ==========================================================================================
# paths: where things are on this computer
# ==========================================================================================
# Seven folders. They have NO default, in this file or in xdssat: every computer sets its own.
# Fill them in your own copy (configs/xdssat.yml), or set the environment variable named under
# each one, which wins over the file. With the variables, one shared experiment file works on
# several machines unchanged. A folder left null is fine until a step needs it; that step then
# stops and says which line to fill. python scripts/check_setup.py lists all seven, where each
# value came from, and the line to edit.
#
# The engine and work folders must be SHORT paths (under about 40 characters) on a local disk,
# OUTSIDE OneDrive or any synced folder. The engine keeps file paths in fixed 80 to 102
# character text buffers (docs/feasibility-review.md, section 4): a long path breaks runs,
# often without a clear error, and a synced folder locks files while the engine writes them.
#
# The examples are the reference machine's folders, as a pattern to follow.
# ------------------------------------------------------------------------------------------
paths:
  # The DSSAT engine folder: dscsm048.exe, DSCSM048.CTR, DSSATPRO.V48, Genotype/, StandardData/.
  # Built by python scripts/build_engine.py, or an installed DSSAT 4.8 (e.g. C:/DSSAT48).
  # Short and outside OneDrive (see above). Needed to run. Environment variable: XDSSAT_ENGINE.
  # Example: C:/TEMP/dsn/dssat   Default: not set
  engine: null
  # Scratch folder for the engine: each run gets a subfolder, deleted when it finishes; the
  # engine build also goes here (build/). Short, local, outside OneDrive (see above); a fast
  # local disk (SSD) helps because every process writes and reads its weather and soil files
  # here. Needed to run. Environment variable: XDSSAT_WORK.
  # Example: C:/TEMP/dsn/work   Default: not set
  work: null
  # The AgERA5 daily weather archive: folders srad/, t2mmax/, t2mmin/, precip/ (required) and
  # t2mdp/, ws10m/, each with one file per year (agera5_<folder>_<YYYY>.nc). Needed once, to
  # build the weather cache (python scripts/build_agera5_cache.py). Any local disk.
  # Environment variable: XDSSAT_AGERA5. Example: E:/temp/agera5   Default: not set
  agera5: null
  # The SoilGrids 2.0 mirror (<property>/<property>_<depth>_mean.vrt plus tiles), filled by
  # python scripts/fetch_soilgrids.py. Needed to build the soil profiles. Any local disk.
  # Environment variable: XDSSAT_SOILGRIDS. Example: E:/temp/soilgrids   Default: not set
  soilgrids: null
  # Source maps: idn-lbs/ (rice fields, MoA irrigation classes) and idn-soil/ (soil map,
  # agro-ecological zones). Needed by python scripts/prepare_rasters.py. Any local disk.
  # Environment variable: XDSSAT_INPUTS. Example: E:/temp   Default: not set
  inputs: null
  # Where xdssat keeps what it prepares (weather cache, 100 m rasters, soil profiles; about
  # 5 GB for Indonesia) and its runs (runs/, unless run > output_folder says otherwise).
  # Any local disk with room; outside OneDrive is better (large files that change often).
  # Needed to run. Environment variable: XDSSAT_CACHE. Example: E:/temp/xdssat   Default: not set
  cache: null
  # Admin boundaries with BPS codes: idn_bnd_adm1.shp (provinces) and idn_bnd_adm2.shp
  # (districts). Needed only for the district and province layers and comparisons
  # (prepare_rasters.py --layers adm2 ..., clean_moa_yields.py, docs/scripts/export_data.py).
  # Environment variable: XDSSAT_BOUNDARIES.
  # Example: F:/temp/hybrid-bias-correction/data/subset/bnd   Default: not set
  boundaries: null


# ==========================================================================================
# aoi: the area of interest
# ==========================================================================================
# Which crop is simulated. The box picks the part of the crop mask to read; the region, when
# there is a region input, keeps only the crop inside it. The crop is grouped by weather cell
# (AgERA5: 0.1 degree, about 11 km), and each cell is simulated once per water regime.
#
# Any area works for which the inputs are prepared (see the inputs section). The soil input
# is made for the area once:
#   python scripts/prepare_soils.py --config <this file> --aoi <name>
# The Ministry of Agriculture irrigation map of the case study covers Java only; elsewhere use
# another water regime map or treatments > default_regime.
# ------------------------------------------------------------------------------------------
aoi:
  # Short name, used in file and folder names (runs/<name>_..., soil files).
  # Allowed: letters, digits, _ or -, at most 20 characters, no spaces.
  # A new name needs a soil input made for the area (prepare_soils.py, see above). Default: java
  name: java
  # Box around the area in degrees:
  #   [west longitude, south latitude, east longitude, north latitude]
  # Allowed: west < east within -180..180, south < north within -90..90.
  # Too small: crop outside the box is left out, even inside the region.
  # Too large: only slower to prepare (more of the grid is read); the region still decides.
  # Default (all of Java): [105.0, -9.0, 114.7, -5.0]
  bbox: [105.0, -9.0, 114.7, -5.0]
  # Region name: a class of the region input (inputs > region; for the Java case study the
  # island groups of the agro-ecological zone map, e.g. Jawa). Only crop inside this region is
  # simulated. A name the region input does not have stops the run and lists the valid names.
  # null: no region filter, aoi > bbox alone decides (needed when inputs > region is null).
  # Default: Jawa
  region: Jawa


# ==========================================================================================
# inputs: the prepared data this run reads
# ==========================================================================================
# A run needs six kinds of input. Each is a prepared dataset: files in a standard form plus a
# small description (input.json) in <cache>/inputs/<kind>/<name>/. Here you only name which
# dataset of each kind to use. Where the data came from does not matter to the run: weather
# from AgERA5, ERA5-Land, NASA POWER or CHIRPS, a crop mask from a national map or a global
# land-cover map, soil from SoilGrids or a soil survey. What matters is that the prepared
# dataset meets the requirements, which every check and run tests first, in plain words.
#
#   weather       daily SRAD, TMAX, TMIN, RAIN (DEWP, WIND optional) on a lat/lon grid,
#                 in DSSAT units, for every run year and the year after
#   crop_mask     where the crop grows, as area per pixel; decides which weather cells are
#                 simulated and weights every result by crop area. Always needed.
#   soil          one DSSAT soil profile per weather cell
#   water_regime  a class per pixel (e.g. irrigation type) that treatments > water_regimes
#                 turns into irrigated or rainfed, or the irrigated share of each pixel (0-1),
#                 which splits its crop area. null = every crop pixel gets
#                 treatments > default_regime.
#   region        a class per pixel; aoi > region names the one to keep (null = the bbox
#                 decides)
#   zones         a class per pixel for seasons > mode: by_zone (null = not used)
# Rasters may be on any grid and CRS; class layers are read at the crop pixel centres.
#
# The full list of requirements is in src/inputs.py. To see the datasets you have, and
# whether this file's choice meets the requirements:  python scripts/register_inputs.py --list
# Files made by the original xdssat scripts are registered with
#   python scripts/register_inputs.py
# under the names below.
# ------------------------------------------------------------------------------------------
inputs:
  # Daily weather. Too short a record: run years without weather (or without the following
  # year, which every season runs into) stop the run before it starts.
  # Default: agera5_idn (AgERA5 0.1 degree, cut to Indonesia)
  weather: agera5_idn
  # Crop area per pixel. A map that also counts non-crop land as crop puts simulated rice on
  # it (too much area, wrong places); one that misses fields leaves them out.
  # Default: rice_atrbpn_idn (ATR/BPN 2024 rice fields, share of each 1 ha pixel)
  crop_mask: rice_atrbpn_idn
  # Soil profiles, one per weather cell with crop (it must be made for the weather input and
  # crop mask above). Default: soilgrids_java (SoilGrids 2.0, built by prepare_soils.py)
  soil: soilgrids_java
  # Irrigation classes (or irrigated share) per pixel; null = treatments > default_regime for
  # all crop. Default: irrigation_moa_idn (MoA irrigation map of Java, gaps filled from the
  # nearest class under the ATR/BPN rice fields)
  water_regime: irrigation_moa_idn
  # Region classes per pixel; null = no region filter (then aoi > region: null too).
  # Default: islands_bbsdlp_idn (island groups of the BBSDLP agro-ecological zone map; Jawa is
  # one of them)
  region: islands_bbsdlp_idn
  # Zone classes per pixel, used only by seasons > mode: by_zone and kept as a column of the
  # strata. null = no zones. Default: aez_bbsdlp_idn (BBSDLP agro-ecological zones)
  zones: aez_bbsdlp_idn


# ==========================================================================================
# prepare: making prepared inputs from your own files
# ==========================================================================================
# The inputs section above names datasets that already exist. This section says how to make
# one from files you downloaded yourself, with the matching script: weather
# (prepare_weather.py), crop mask (prepare_crop_mask.py), soil (prepare_soils.py), and water
# regime, region and zones (prepare_layers.py). Each script has --inspect <file> to show what
# a file holds, except prepare_soils.py.
#
# Weather: each DSSAT variable names its own files, so rain can come from one product and
# temperature from another. The files must hold DAILY values on a regular latitude-longitude
# grid (netCDF). To read off the variable names, units and grid of a file:
#     python scripts/prepare_weather.py --inspect <file>
# Units are read from each file's own units attribute and converted to DSSAT units
# (K, J m-2, W m-2, kWh m-2, metres or kg m-2 of rain, m s-1 ... are understood). All
# variables are put on one grid: grid_step, or, if null, the grid of the TMAX source.
#   files      the file, with {year} where the year goes if there is one file per year.
#              {agera5}, {inputs}, {cache} ... stand for the folders under paths.
#   variable   the variable's name inside the file; for WIND also [u, v] components
#   units      only if the file has no units attribute or an unusual one
#   regrid     exact (same cells), mean (source finer, e.g. 0.05 to 0.1 degree), linear
#              (source coarser) or nearest. Leave it out: chosen from the two grids.
#   height_m   WIND only: measurement height in m (10 for most reanalyses, 2 for POWER WS2M)
#   daily      only for files with more than one value per day (ERA5-Land hourly): how the
#              day is made. max (TMAX), min (TMIN), mean (DEWP, WIND), sum (amounts per time
#              step), accumulated (running totals since 00 UTC, as ERA5-Land's precipitation
#              and radiation: ECMWF documents that its 00 UTC value is the previous day's
#              total). Days are local: utc_offset_hours below (Java: 7). The files of the
#              years before and after are read too, for the first and last local day.
#              A file pattern may hold * for several files (e.g. monthly downloads).
#
# Point sources instead of gridded files (points:, not variables:): each entry is a DSSAT
# .WTH station file or a CSV table (a NASA POWER daily point download, or your own columns
# with columns: and units:). Every cell of the grid (grid_step needed) takes the series of
# its nearest point. Every point needs SRAD, TMAX, TMIN and RAIN on every day of the years;
# a day without them stops with its date. POWER column names (T2M_MAX, T2M_MIN, PRECTOTCORR,
# ALLSKY_SFC_SW_DWN, T2MDEW, WS2M) and units in its header are recognised; check with
#     python scripts/prepare_weather.py --inspect <file.csv>
#   points:
#     - {file: "D:/power/site_a.csv"}
#     - {file: "D:/stations/BDG.WTH"}
#     - {file: "D:/stations/bmkg_bogor.csv", lat: -6.6, lon: 106.8,
#        columns: {TMAX: tx, TMIN: tn, RAIN: rr, SRAD: rs}, units: {SRAD: "MJ m-2", RAIN: mm, TMAX: C, TMIN: C}}
#
# An example with three sources (names as such products often use them; CHECK them with
# --inspect, products and versions differ):
#   prepare:
#     weather:
#       name: mixed_java
#       grid_step: 0.1
#       variables:
#         TMAX: {files: "D:/era5land/tmax_{year}.nc", variable: t2m}
#         TMIN: {files: "D:/era5land/tmin_{year}.nc", variable: t2m}
#         SRAD: {files: "D:/power/power_java.nc", variable: ALLSKY_SFC_SW_DWN}
#         RAIN: {files: "D:/chirps/chirps-v2.0.{year}.days_p05.nc", variable: precip}
#         WIND: {files: "D:/era5land/wind_{year}.nc", variable: [u10, v10], height_m: 10}
# configs/rice-java-all-options.yml has a complete example that works with the AgERA5 archive.
#
# Crop mask: any map that says where the crop is becomes crop hectares per pixel, on the
# map's own grid and CRS (degrees, UTM, equal-area ...). Pixel areas are exact (the
# ellipsoid for degrees; the CRS's area scale for projected maps). To see a file's CRS,
# pixel size and most common values:
#     python scripts/prepare_crop_mask.py --inspect <file>
#   values: classes    a land-cover map; list the crop class codes under classes. E.g. ESA
#                      WorldCover (10 m): [40] Cropland; MODIS MCD12Q1 IGBP (500 m): [12]
#                      Croplands, [14] Cropland/Natural Vegetation Mosaics. A general
#                      cropland class does not say which crop grows there: for rice it means
#                      "rice may grow on any cropland"; a rice map (as ATR/BPN for Java) is
#                      better where there is one.
#   values: fraction | percent   a crop share per pixel (0-1 or 0-100)
#   values: ha | m2 | km2        a crop area per pixel, e.g. MapSPAM physical area (ha)
#   values: polygons             a vector file of fields (shapefile, GeoPackage ...), burned on
#                                an equal-area grid as the Java rice map
# A crop pixel coarser than about 100 m is read as sub-points about 100 m apart (at most
# 10 x 10 per pixel), each with its part of the area, so one pixel can span weather cells and
# the classes of the water regime and region maps (MODIS 500 m: 5 x 5). Aggregate 10 m
# WorldCover (aggregate: 10 gives 100 m) for a smaller file and a faster run; a 9 km map
# (MapSPAM's 5 arc-minutes) is read as 10 x 10 points of about 900 m without any setting.
# The crop mask also decides which weather cells get a soil profile, so prepare the soil for
# it afterwards (python scripts/prepare_soils.py --aoi <aoi> --crop-mask <name>). The water
# regime map must have a class under every crop pixel (the Java irrigation map has one under
# the ATR/BPN rice fields only).
#
# An example with WorldCover tiles (CHECK the file names and classes with --inspect):
#   prepare:
#     crop_mask:
#       name: cropland_worldcover_java
#       files: "D:/worldcover/ESA_WorldCover_10m_2021_v200_*_Map.tif"
#       values: classes
#       classes: [40]
#       aggregate: 10
#       source: "ESA WorldCover 10 m 2021 v200, CC-BY 4.0"
#
# Soil: one DSSAT profile per weather cell with crop, so the soil belongs to one weather input
# and one crop mask (inputs > weather and inputs > crop_mask when it is made). Two methods:
#   method: soilgrids   the crop-weighted mean of SoilGrids 2.0 (250 m, global) under the crop
#                       pixels of each cell, turned into DSSAT layers by pedotransfer (Saxton
#                       and Rawls 2006; src/soils.py). Reads the SoilGrids mirror (paths >
#                       soilgrids) for any area: fetch_soilgrids.py --aoi <aoi> fetches the
#                       tiles it lacks; build_soilgrids_cache.py --aoi <aoi> (optional) makes
#                       preparing it faster.
#   method: sol         your own profiles in a DSSAT .SOL file (a soil survey, WISE, the 27
#                       generic HC27 profiles in DSSAT's HC.SOL ...), with
#                         profile: one ID for every cell, or
#                         map: a raster of codes (+ classes: CSV of code, soil_id) or a vector
#                         file (+ id_column) saying which profile lies where. Each cell takes
#                         the profile under most of its crop; a cell whose crop is wholly off
#                         the map takes the nearest cell's.
# A profile may have at most 20 layers (the engine's limit). Then:
#     python scripts/prepare_soils.py --aoi <aoi>
# An example with one HC27 profile everywhere (Loam, high fertility, 120 cm; pick yours with
# the decision tree at the top of HC.SOL):
#   prepare:
#     soil:
#       name: hc27_loam_java
#       method: sol
#       file: "{engine}/Soil/HC.SOL"
#       profile: HC_GEN0011
# ------------------------------------------------------------------------------------------
prepare:
  # How to make a weather input (null = this file does not make one). The keys:
  #   name                  the dataset to write; use it in inputs > weather afterwards
  #   description           free text, kept in the dataset's description
  #   box                   [west, south, east, north]; null = aoi > bbox (plus one cell)
  #   grid_step             cell size in degrees; null = the grid of the TMAX source.
  #                         Finer cells: more weather cells to simulate (run time grows with
  #                         them) and a bigger soil file; at most 999 x 9999 cells.
  #   years                 [first, last]; null = the run years and the year after
  #   station_code          4 letters or digits written into the weather files (default XDWX)
  #   temperature_height_m  height of the temperature measurements, m (default 2)
  #   variables             SRAD, TMAX, TMIN, RAIN needed; DEWP, WIND optional (see above)
  #   utc_offset_hours      for sub-daily files: local time minus UTC, so days are local (default 0)
  #   points                point sources instead of variables (see above)
  #   wind_height_m         points only: wind measurement height, m (default 2, as POWER WS2M)
  # Then: python scripts/prepare_soils.py --weather <name>, and set inputs > weather and
  # inputs > soil to the new datasets. Default: null
  weather: null
  # How to make a crop mask input (null = this file does not make one). The keys:
  #   name          the dataset to write; use it in inputs > crop_mask afterwards
  #   files         the map; * matches several tiles (they must share one grid).
  #                 {inputs}, {cache} ... stand for the folders under paths.
  #   values        classes, fraction, percent, ha, m2, km2 or polygons (see above)
  #   classes       values: classes only, the crop class codes, e.g. [40]
  #   aggregate     source pixels per side summed into one output pixel (default 1 = the
  #                 source grid). Larger: a smaller file and a faster run, each pixel coarser.
  #   split         cut each source pixel into split x split equal parts (default 1), for
  #                 maps whose pixels are not much smaller than a weather cell
  #   box           [west, south, east, north]; null = aoi > bbox
  #   source, description   free text, kept in the dataset's input.json
  #   polygons only: layer (of a multi-layer file), select ({column: [values]} to keep),
  #                 class_column (kept as the crop class), pixel_m (default 100),
  #                 subpixels (default 5, i.e. 20 m sub-pixels count the share)
  # Then: python scripts/prepare_soils.py --aoi <aoi> --crop-mask <name>, and set
  # inputs > crop_mask and inputs > soil to the new datasets. Default: null
  crop_mask: null
  # How python scripts/prepare_soils.py makes the soil input (see above). The keys:
  #   name        the soil input to write, in <cache>/inputs/soil/<name>/. null (SoilGrids
  #               only) keeps the original names: <cache>/soils/<aoi>.SOL, registered as
  #               soilgrids_<aoi> (plus _<weather> and _<crop mask> when they are not the
  #               Java defaults).
  #   method      soilgrids or sol
  #   soc_scale   soilgrids only: a factor on SoilGrids organic carbon by depth.
  #               wise_indonesia: 0.70 down to 30 cm, 0.63 to 100 cm, 0.47 to 200 cm, the
  #               median of measured WISE 1.1 / SoilGrids over 78 profiles of Indonesia
  #               (src/soils.py, measured 2026-11-06); SoilGrids is higher than WISE there.
  #               none: SoilGrids as is. Or six factors, one per SoilGrids depth
  #               (0-5cm, 5-15cm, 15-30cm, 30-60cm, 60-100cm, 100-200cm).
  #               How much it matters (measured on a 30-cell sample of Java, 2015-2016, the
  #               other settings as in this file): none instead of wise_indonesia (more
  #               carbon) changed area-weighted yield by -0.2% irrigated and -2.5% rainfed,
  #               N uptake by -0.2% and -2.9%, and irrigation water by +10.5%.
  #               Outside Indonesia, wise_indonesia has no basis: use none, or fit factors
  #               to the WISE profiles of your country and paste what it prints:
  #                   python scripts/fit_soc_scale.py --country Philippines
  #               Fitted with that script (WISE 1.1 profiles), 0-30 / 30-100 / 100-200 cm:
  #               Indonesia 0.70 / 0.63 / 0.47 (78 profiles), Philippines 0.72 / 0.83 / 0.64
  #               (49), Thailand 0.72 / 0.61 / 0.58 (50), India 0.70 / 0.86 / 0.75 (92).
  #   country     text in the profile header only (the engine does not use it)
  #   sol only:   file, and profile or map (+ classes or id_column, layer of a multi-layer
  #               vector file); description and source are free text for input.json
  # Default: SoilGrids with the Indonesian factors, as the Java case study
  soil:
    name: null
    method: soilgrids
    soc_scale: wise_indonesia
    country: Indonesia
  # How python scripts/prepare_layers.py makes a water regime, region or zone input from your
  # own map (null = this file does not make one). The keys:
  #   name          the input to write; use it in inputs > water_regime / region / zones
  #   values        classes: a class map, a raster of codes (classes: CSV of code, name) or a
  #                 vector file (class_column; burned on an equal-area grid of pixel_m metres,
  #                 default 100). Water regime only: fraction or percent, a raster of the
  #                 irrigated share of each pixel; or ratio, two rasters of crop area on one
  #                 grid, irrigated and total (e.g. MapSPAM physical area of the crop, the
  #                 file suffixes _I irrigated and _A all technologies), share = irrigated / total.
  #   files         the map (classes, fraction, percent); {inputs}, {cache} ... as above
  #   irrigated, total   the two area rasters (ratio)
  #   box           [west, south, east, north]; null = aoi > bbox
  #   layer         the layer of a multi-layer vector file
  #   source, description   free text, kept in the input's input.json
  # A class map in several tiles: files with *, joined over the box. E.g. GFSAD LGRIP30
  # (Landsat, 30 m, nominal 2015, 10 x 10 degree tiles from NASA LP DAAC with an Earthdata
  # login; Java: tiles S10E100 and S10E110): 0 water, 1 non-cropland, 2 irrigated, 3 rainfed.
  #   water_regime: {name: lgrip30_java, values: classes, files: "{inputs}/lgrip30/*.tif"}
  # with  treatments > water_regimes: irrigated classes [2], rainfed [3], and
  # default_regime: rainfed for crop on classes 0 and 1.
  # Example (the SPAM 2020 v2r2 rice files of the physical-area zip):
  #   water_regime:
  #     name: spam2020_rice_irrigated
  #     values: ratio
  #     irrigated: "{inputs}/spam2020/spam2020_V2r2_global_A_RICE_I.tif"
  #     total: "{inputs}/spam2020/spam2020_V2r2_global_A_RICE_A.tif"
  # Default: null for all three
  water_regime: null
  # A region map, same keys (values: classes only). Default: null
  region: null
  # A zone map for seasons > mode: by_zone, same keys (values: classes only). Default: null
  zones: null


# ==========================================================================================
# template: the DSSAT experiment every season copies
# ==========================================================================================
# A template is an ordinary DSSAT experiment file (FileX). Each simulated season copies one of
# its treatments and changes only the field (weather cell, soil profile, coordinates) and the
# dates (every date moves with the planting date), so its crop management is kept exactly:
# transplanting, seedling age, plant population, puddling, bunds, flood depth, fertilizer
# timing, residue. To change management that has no setting in this file, edit (a copy of)
# the template in DSSAT's own tools and point 'file' at it.
#
# The default, XDRI8601.RIX (written by python scripts/make_templates.py), is IRRI's
# IRMZ8601 experiment (Munoz, 1986, transplanted IR 58) plus a rainfed bunded water level,
# IR 64 as a second cultivar, and one treatment per cultivar x water level x N rate.
# ------------------------------------------------------------------------------------------
template:
  # The FileX. It needs fertilizer and irrigation levels for the N rates and water regimes of
  # the treatments section (check_setup.py and run_aoi.py --check say which are missing).
  # Default: templates/XDRI8601.RIX
  file: templates/XDRI8601.RIX
  # The crop model's cultivar file in <engine>/Genotype, without .CUL; it must match the crop
  # of the template. Default: RICER048 (CERES-Rice).
  crop_model: RICER048


# ==========================================================================================
# cultivars: the varieties to run
# ==========================================================================================
# One line per variety, as   name: code
# The code is the 6-character cultivar number (INGENO, first column) in the cultivar file,
# <engine>/Genotype/RICER048.CUL. The name is a label (at most 16 characters) used in folder
# names and outputs. Every cultivar listed gets its own run folders.
#
# A cultivar the template lists (IR 58, IR 64) uses its own template level. Any other code is
# put into the template's cultivar level, so a new variety needs only its line in the
# cultivar file (calibrated coefficients), no FileX edit.
#
# How different they are (measured on a 30-cell sample of Java, 2015-2016, uniform calendar,
# SLPF 1 = uncalibrated, 140 kg N): irrigated IR 58 took 92 days from transplanting to
# maturity and gave 7,510 kg/ha, IR 64 took 108 days and gave 8,480 kg/ha (rainfed: 107 and
# 126 days, 8,220 and 9,370 kg/ha). The longer cultivar gave more yield, needs a longer gap
# before the next season (seasons section), and lost more to warming (scenarios section).
#
# Default: IR 58 only. To run IR 64 as well, add the line   "IR 64": IB0015
# ------------------------------------------------------------------------------------------
cultivars:
  "IR 58": IB0012


# ==========================================================================================
# treatments: fertilizer and water
# ==========================================================================================
# Nitrogen rates are run as separate folders (every rate x every cultivar x every scenario).
# Water regimes are not chosen per run: every crop pixel gets the regime of its class in the
# water regime input (in the case study, the MoA irrigation classes), and one run covers both.
# ------------------------------------------------------------------------------------------
treatments:
  # Nitrogen rates to run, in kg N/ha (urea, 2/3 at 18 and 1/3 at 41 days after transplanting,
  # as in the template). Allowed: the rates listed under nitrogen_levels.
  # More rates: more run folders, each about as long as the first.
  # Measured (on a 30-cell sample of Java, 2015-2016, uniform calendar, SLPF 1 = uncalibrated,
  # IR 58): irrigated 4,710 / 7,020 / 7,510 kg/ha and rainfed 3,260 / 6,770 / 8,220 kg/ha at
  # 0 / 70 / 140 kg N. The response flattens towards 140 kg N, most in irrigated rice.
  # Example: [0, 70, 140]. Default: [140]
  nitrogen_kg: [140]
  # Which fertilizer level (MF) of the template gives each rate:   kg N/ha: level.
  # Level 0 means no fertilizer. Only change this together with the template: to add a rate,
  # add a fertilizer level to the template FileX first, then list it here.
  # Default: {0: 0, 35: 1, 70: 2, 105: 3, 140: 4}
  nitrogen_levels: {0: 0, 35: 1, 70: 2, 105: 3, 140: 4}
  # Water regimes. Each crop pixel gets the regime of its class in the water regime input; the
  # codes below are the MoA irrigation classes of the case study (1 technical, 2 semi-technical,
  # 3 simple irrigation, 4 rainfed). For another map list its own codes (LGRIP30: irrigated
  # [2], rainfed [3]). template_level is the
  # irrigation level (MI) of the template: 1 = constant 50 mm flood (fully irrigated),
  # 3 = rainfed with 150 mm bunds (holds only rain). Each class belongs to exactly one regime.
  # Moving class 3 (simple irrigation) to rainfed, say, tests how much the weakest irrigation
  # matters. A regime name not used by any season in the calendar is never planted.
  # Default: irrigated = level 1, classes [1, 2, 3]; rainfed = level 3, class [4]
  water_regimes:
    irrigated: {template_level: 1, irrigation_classes: [1, 2, 3]}
    rainfed: {template_level: 3, irrigation_classes: [4]}
  # The regime of crop that the water regime map does not cover: class 0 (no class) in a class
  # map, no value in a share map, or all crop when inputs > water_regime is null.
  # null: such crop stops the run with the area it concerns. A regime name (e.g. rainfed)
  # gives it that regime, and also crop on a class no regime lists (e.g. LGRIP30's
  # non-cropland class). Outside an irrigation map's area, rainfed is the cautious choice:
  # irrigated rice there would be assumed, not mapped.
  # Measured (Java 2015-2016, MODIS MCD12Q1 cropland as the crop mask): 30% of its area lies
  # off the MoA irrigation map. Default: null
  default_regime: null
  # With an irrigated-share map, which regime takes the share and which the rest of each
  # pixel's crop area. Both must be water regimes above. Default: share irrigated, rest rainfed
  share_regimes: {share: irrigated, rest: rainfed}
  # Soil water at the start of each season, as a share of the plant-available water of every
  # soil layer: 0 = wilting point (dry), 1 = field capacity (wet). Applied to every season.
  # Allowed 0 to 1. Recommended 0.5 to 1.
  # Too low: rainfed rice starts in a dry soil; the cost measured below was small.
  # Too high: no harm seen. Irrigated rice did not respond at all in the runs below.
  # Measured (on a 30-cell sample of Java, 2015-2016, uniform calendar, SLPF 1 = uncalibrated):
  # irrigated yields the same at 0.5, 0.7 and 0.9; rainfed wet season 8,120 / 8,180 / 8,220
  # kg/ha, so 1.3% lower at 0.5 than at 0.9.
  # Default: 0.9
  initial_soil_water: 0.9


# ==========================================================================================
# seasons: when rice is planted
# ==========================================================================================
# The planting (transplanting) date of every season, in every weather cell and year.
# Years are agricultural years: year 2015 runs from year_starts in 2015 to the day before
# it in 2016, so the wet season of late 2015 and the dry season of early 2016 are both "2015".
# ------------------------------------------------------------------------------------------
seasons:
  # How planting dates are chosen.
  #   uniform   the calendar below, the same date everywhere and every year. Simple and fast;
  #             good for comparing scenarios, but ignores that the rains start at different
  #             times across Java.
  #   per_cell  the wet season starts from the rainfall onset of each weather cell (the onset
  #             rule below, median over years); later seasons follow it.
  #   by_zone   one date per agro-ecological zone, from zone_table, or, without a table, the
  #             median onset of each zone's cells.
  # per_cell and by_zone read the rain of every cell first (a few seconds for a sample, longer
  # for all of Java). Default: uniform
  mode: uniform
  # First day of the agricultural year, "MM-DD". It must fall after the last harvest of one
  # crop year and before the first planting of the next; the onset search also runs from this
  # day for one year. Too late (after the onset): onset is found in the following rains and the
  # wet season shifts by a year. For Java "08-01" sits in the dry season, before every onset
  # found (earliest: 1 October). Default: "08-01"
  year_starts: "08-01"
  # The seasons: a name, a date "MM-DD", and the water regimes that plant in that season.
  # The first season is the one the onset rule moves; later seasons follow it.
  # A rainfed regime in a dry-season line would plant rainfed rice into the dry months.
  # Default: wet on "11-15" for irrigated and rainfed rice, dry on "04-01" for irrigated rice
  # only. These defaults are placeholders, not an agronomic calendar. For comparison, the
  # median onset over Java's 1,187 cells (1991-2020, rule below) is 1 November (10% of cells
  # before 11 October, 10% after 21 November), so transplanting 20 days later falls around
  # 21 November (measured, runs/java_per_cell_1991-2020/onset.csv).
  calendar:
    - {name: wet, date: "11-15", regimes: [irrigated, rainfed]}
    - {name: dry, date: "04-01", regimes: [irrigated]}
  # Rainfall onset rule, for per_cell and for by_zone without a zone table. Onset is the first
  # dasarian (10-day period: days 1-10, 11-20, 21-end of month) with at least rain_mm of rain
  # that starts a run of `dasarian` such periods in a row (BMKG rule; sources in
  # src/management.py). Cells with no onset in a year leave that year out of their median;
  # cells with no onset at all use the calendar date.
  onset:
    # Rain needed in one dasarian, mm. Allowed: more than 0. Recommended 40 to 60.
    # Too low: early showers count as the start of the rains (false starts), so planting
    # comes too early. Too high: onset comes late or not at all in drier cells.
    # With 50 mm every Java cell had an onset in at least 25 of 30 years (measured, 1991-2020).
    # Default: 50
    rain_mm: 50
    # How many wet dasarian in a row make an onset. Allowed 1 to 36. Recommended 2 to 3.
    # 1: the first wet dasarian counts (prone to false starts). Higher: the rains must hold
    # longer, so onset is later and more reliable. Default: 3
    dasarian: 3
    # Days from onset to transplanting of the first season: the seedbed is sown at onset and
    # the template transplants 23-day-old seedlings. Allowed 0 to 120. Recommended 15 to 30.
    # Too low: transplanting before the field holds water (rainfed rice suffers first).
    # Too high: the season moves into the end of the rains. Default: 20
    transplant_after_days: 20
    # Days from one season's planting to the next season's planting (wet to dry). Allowed 0 to
    # 300. It should be at least the field duration of the cultivar plus land preparation:
    # irrigated IR 58 took about 92 days from transplanting to maturity, IR 64 about 108,
    # rainfed about 107 and 126 (measured, see cultivars). Recommended 110 to 150.
    # Too low: the seasons overlap in time (the engine runs them apart, so no error, but no
    # farm could). Too high: the dry season starts late into the dry months. Default: 120
    next_season_after_days: 120
    # Years used for the onset climatology (median onset), [first, last]. null = the run years.
    # More years give a steadier median. Default: null
    years: null
  # by_zone only: planting date per zone and season. null = take the median onset of each
  # zone's cells. Either a CSV file with columns zone, season, month_day, or rows here:
  #   zone_table:
  #     - {zone: 5, season: wet, date: "12-01"}
  # Zones not listed use the calendar date. Default: null
  zone_table: null
  # by_zone only: the zone layer. Default: aez (agro-ecological zone codes,
  # <cache>/rasters/idn_aez_classes.csv)
  zone_column: aez


# ==========================================================================================
# scenarios: variations to run
# ==========================================================================================
# Each scenario gets its own run folders (combined with every cultivar and N rate). A scenario
# has a name and any of the settings below; a setting left out keeps the template, the
# weather and the cultivar file as they are. Keep a "baseline" scenario to compare against.
#
#   name                   letters, digits, . _ or -, at most 30; used in the folder name.
#                          The scenario named "baseline" adds nothing to the folder name.
#   description            free text, kept in the run folder's experiment.yml
#
#   environment            weather changes for the whole of every season, written to the FileX
#                          ENVIRONMENT MODIFICATIONS. For each of
#                            daylength (h), radiation (MJ/m2/d), tmax (C), tmin (C),
#                            rain (mm/d), co2 (ppm), dewpoint (C), wind (km/d)
#                          give one way to change it, with a number of at most 4 characters
#                          (the engine reads 4, IPENV.for:1000):
#                            add / subtract  a fixed amount        tmax: {add: 2}
#                            multiply        a factor              rain: {multiply: 0.8}
#                            replace         a fixed value         co2: {replace: 550}
#                          Recommended ranges for climate change tests: tmax and tmin add 0 to
#                          4 C; rain multiply 0.7 to 1.3; co2 replace 400 to 800 ppm. Without a
#                          change the template takes CO2 from the engine's Mauna Loa record
#                          (StandardData/CO2048.WDA: about 400 ppm in 2015).
#                          Measured (a 30-cell sample of Java, 2015-2016, uniform calendar,
#                          SLPF 1 = uncalibrated, 140 kg N, against baseline):
#                            co2 replace 550: IR 58 +12% irrigated, +8% rainfed; IR 64 +10%, +7%
#                            tmax and tmin add 2: IR 58 -12% irrigated, -10% rainfed; IR 64 -26%,
#                              -12%; seasons 5 to 10 days shorter
#                            rain multiply 0.8: under 1% (season rain of rainfed rice fell from
#                              1,265 to 1,023 mm, still enough; irrigation made up the rest)
#                          A drier sample, the dry season or rainfed rice without bunds may
#                          respond more to rain.
#
#   cultivar_coefficients  coefficients of the cultivar file to change, by their header name in
#                          RICER048.CUL: {TCLDF: 19} for every cultivar of the run, or
#                          {"IR 64": {TCLDF: 18}} for one. The engine's own file is never
#                          changed; each run writes its own copy.
#                          TCLDF is the cold-sterility threshold (C): canopy temperature below
#                          it around heading cuts spikelet fertility (RI_Phenol.for:600-648).
#                          RICER048.CUL has 15.0 for IR 58 and IR 64. 19 lowered yields of cool
#                          highland cells (Tmin under 20 C) by about 40% and left the lowlands
#                          as they were (measured, Java calibration, docs/getting-started.md).
#
#   slpf                   soil fertility factor, more than 0 and at most 1. CERES-Rice
#                          multiplies daily carbohydrate production by it (RI_Grosub.for:648-649),
#                          so it stands for every yield loss the model does not simulate (pests,
#                          weeds, nutrient limits, management). It is the main calibration
#                          factor against observed yields. Yield falls faster than SLPF: 0.8 gave
#                          71% and 0.7 gave 55% of the SLPF 1 yield (measured, 40-cell sample).
#                          Calibrated for Java: 0.76 with slpf_rainfed 0.58 and TCLDF 19, fitted
#                          to district yields 1992-2020 (scripts/fit_slpf.py). Default: 1.0
#   slpf_rainfed           SLPF for rainfed rice only. Default: the same as slpf
#   slpf_table             CSV with columns iy, ix, water, slpf (from scripts/fit_slpf.py): SLPF
#                          per weather cell and regime. Replaces slpf and slpf_rainfed (give only
#                          one of them).
#
# Examples (remove the # to use them):
#   - name: co2_550
#     description: "CO2 at 550 ppm all season"
#     environment: {co2: {replace: 550}}
#   - name: warmer2
#     description: "2 C warmer days and nights"
#     environment: {tmax: {add: 2}, tmin: {add: 2}}
#   - name: calibrated
#     slpf: 0.76
#     slpf_rainfed: 0.58
#     cultivar_coefficients: {TCLDF: 19}
# Default: one scenario, baseline, with no changes.
# ------------------------------------------------------------------------------------------
scenarios:
  - name: baseline


# ==========================================================================================
# years: the agricultural years to simulate
# ==========================================================================================
# [first, last], both included. Allowed 1900 to 2100, first not after last; in practice the
# years the AgERA5 archive covers (1979 onward on the reference machine). The first year needs
# weather from about 40 days before its first planting. Seasons that need weather after the
# last AgERA5 day are left out, with a message. Run time grows in step with the number of
# years (the full Java run: 30 years in 14.3 min). Default: [1991, 2020]
# ------------------------------------------------------------------------------------------
years: [1991, 2020]


# ==========================================================================================
# run: how the work is split
# ==========================================================================================
# These settings change speed and memory, not results, except sample and seed (which pick the
# cells) and season_days (which can make seasons fail when too low).
# ------------------------------------------------------------------------------------------
run:
  # Engine processes running at the same time. Allowed 1 or more. Recommended: the number of
  # CPU cores, or a few less to keep the machine usable. Separate engine processes scale
  # almost linearly (measured: 8 processes x 50 cells in 7.5 s against 9.0 s for one).
  # Too low: slow. Too high (more than the cores): no faster, and each process needs its own
  # folder of weather files in the work folder. Default: 32
  workers: 32
  # Seasons per engine process (one FileX). Allowed 1 to 999 (the engine's treatment limit,
  # IPEXP.for:865). Recommended 50 to 200. Too low: many small processes and folders, the
  # start-up cost dominates. Too high: slower per season, because the engine slows with many
  # treatments in one file (measured: 0.18 s per season with 50, 0.24 s with 500), and fewer
  # chunks than workers leaves cores idle. Default: 200
  chunk_size: 200
  # Agricultural years whose weather is held in memory at once. Allowed 1 or more.
  # Recommended 5 to 10. Too low: the weather cache is read more often (slower). Too high:
  # more memory; for all of Java one year of weather is about 1,187 cells x 365 days x 6
  # variables, some tens of MB (estimate, not measured). Default: 5
  years_per_batch: 5
  # Run only this many weather cells, drawn at random weighted by rice area: a quick test of
  # a new experiment file. null = all cells. Example: 30 (about 35 s for 2 years, 156
  # seasons, measured). Results of a sample are for checking, not for reporting. Default: null
  sample: null
  # Random seed of the sample: the same seed and sample size draw the same cells, so sampled
  # runs of different scenarios are comparable. Any whole number. Default: 1
  seed: 1
  # Days of weather given to each season after planting. Allowed 60 to 400. Recommended 200
  # to 250. It must cover the longest season: the longest seen in the Java runs is 162 days.
  # Too low: seasons not mature when the weather ends fail (listed in failed.csv). Too high:
  # more seasons at the end of the weather record are left out, and more weather is read.
  # Default: 220
  season_days: 220
  # Parent folder of the run folders. null = <cache>/runs. A folder per study (e.g.
  # E:/temp/xdssat/runs/co2_study) keeps studies apart. Default: null
  output_folder: null
