# xdssat conda environment
# Create with: conda env create -f environment.yml
# The DSSAT engine (dscsm048) is built separately: python scripts/build_engine.py
name: xdssat
channels:
  - conda-forge
dependencies:
  - python>=3.11
  # --- Mandatory ---
  - numpy>=1.26
  - pandas>=2.1
  - xarray>=2024.1
  - netcdf4>=1.6
  - cftime>=1.6
  - pyyaml>=6.0       # reads the experiment files (configs/*.yml)
  # --- Gridded inputs ---
  - geopandas>=1.0
  - pyogrio>=0.7
  - shapely>=2.0
  - pyproj>=3.6
  - rasterio>=1.3
  - scipy>=1.11
  - openpyxl>=3.1
  # --- Optional: tests ---
  - pytest>=8.0
  # --- Optional: large inputs ---
  - dask>=2024.1
  # --- Optional: notebooks and plots ---
  - jupyterlab>=4.0
  - matplotlib>=3.8
  # --- Optional: building the engine (Linux/macOS; on Windows use MinGW-w64) ---
  - gfortran
  - cmake
  - make
